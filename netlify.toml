# What gets deployed:
#
#   /                     the React build, reading through the data seam
#   /binding-template     the prototype with every data property tokenised.
#                         Kept as the LAYOUT reference; its fields predate the
#                         schema decisions, so it is not the field reference.
#   /prototype.html       the original prototype, with its dummy data
#
# build.sh assembles all of them into dist/.

[build]
  command = "./build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The binding template keeps a URL of its own, so the layout reference is still
# reachable without being what anyone lands on.
[[redirects]]
  from = "/binding-template"
  to = "/binding-template.html"
  status = 200

# The app used to live under /app/. Anything still pointing there — a bookmark, a
# Teams message, an old deploy-preview link — lands on the same page at the root
# rather than a 404. Must come before the catch-all below: Netlify takes the first
# rule that matches.
[[redirects]]
  from = "/app/*"
  to = "/:splat"
  status = 301

# Client-side routing: every path that is not a real file reaches index.html so the
# router can read it. No `force`, deliberately — without it Netlify serves an actual
# file when one exists, which is what keeps /assets/*, /prototype.html and the images
# from being swallowed by this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Not for the public while it is V0. These do not replace auth — Supabase Auth
# is what actually protects it — but they keep it out of search results.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
