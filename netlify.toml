# What gets deployed:
#
#   /             the prototype with every data property tokenised — the whole
#                 app, every page, the filters and the job panel, with
#                 {{table.column}} wherever a value will come from Supabase.
#                 This is the reference the React build is working towards.
#   /app/         the React build in progress, reading through the data seam.
#   /prototype.html   the original prototype, with its dummy data, for comparison.
#
# build.sh assembles all three into dist/.

[build]
  command = "./build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The React app does client-side routing under /app/, so its paths have to reach
# its own index.html. The root is a single static file and needs nothing.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Not for the public while it is V0. These do not replace auth — Supabase Auth
# is what actually protects it — but they keep it out of search results.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
