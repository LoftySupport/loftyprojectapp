# Build the React app in app/, not the prototype at the repo root.
#
# Without this, Netlify publishes the repo root — which is index.html, the
# prototype — and the app never gets built at all.
#
# No `base` is set on purpose. When base is set, Netlify resolves `publish`
# relative to it, and the two together are a reliable way to end up pointing at
# app/app/dist. Running the build from the root with an explicit path is
# unambiguous, at the cost of installing dependencies in the command.

[build]
  command = "cd app && npm ci && npm run build"
  publish = "app/dist"

[build.environment]
  NODE_VERSION = "22"

# React Router does client-side routing, so every path has to reach index.html.
# Without this, /jobs and /wiring 404 on a hard refresh or a shared link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Not for the public while it is V0. These do not replace auth — Supabase Auth
# is what actually protects it — but they keep it out of search results.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
