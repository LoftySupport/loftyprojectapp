# What gets deployed:
#
#   /                     redirects to /app/ — the app is the build now
#   /app/                 the React build, reading through the data seam
#   /binding-template     the prototype with every data property tokenised.
#                         Kept as the LAYOUT reference; its fields predate the
#                         schema decisions, so it is not the field reference.
#   /prototype.html       the original prototype, with its dummy data
#
# build.sh assembles all of them into dist/.

[build]
  command = "./build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The root is the app. Landing on the tokenised prototype made it look like the
# work had stopped — it still shows the pre-simplification project and the old
# six roles, because it is being kept for layout, not for fields.
[[redirects]]
  from = "/"
  to = "/app/"
  status = 302
  force = true

# The binding template keeps a URL of its own, so the layout reference is still
# reachable without being what anyone lands on.
[[redirects]]
  from = "/binding-template"
  to = "/binding-template.html"
  status = 200

# The React app does client-side routing under /app/, so its paths have to reach
# its own index.html.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Not for the public while it is V0. These do not replace auth — Supabase Auth
# is what actually protects it — but they keep it out of search results.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
